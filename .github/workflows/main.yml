name: Build Messenger APK
on:
  push:
    branches:
      - main  # আপনার মেইন ব্রাঞ্চের নাম যদি 'master' হয় তবে এখানে master লিখে দিন

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Build APK with EAS
        run: npx eas-cli build --platform android --profile preview --local
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }} # এটি আপনার দেওয়া টোকেনটি ব্যবহার করবে

      - name: 📥 Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: messenger-app-apk
          path: ./*.apk # বিল্ড হওয়ার পর যে APK ফাইলটি তৈরি হবে সেটি সেভ করবে
