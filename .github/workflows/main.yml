name: Build Messenger APK
on:
  push:
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🛠️ Setup EAS Project ID (Bypass Error)
        run: npx eas-cli project:init --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 Build APK with EAS (Bypass Prompt)
        run: npx eas-cli build --platform android --profile preview --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: messenger-app-apk
          path: ./*.apk 
