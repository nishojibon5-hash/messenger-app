name: Build Messenger APK
on:
  push:
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4 # আপডেট করা হয়েছে v4 এ

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4 # আপডেট করা হয়েছে v4 এ
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Build APK with EAS
        run: npx eas-cli build --platform android --profile preview --local
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }} 

      - name: 📥 Upload APK Artifact
        uses: actions/upload-artifact@v4 # এটিই মূল সমাধান, v4 ব্যবহার করতে হবে
        with:
          name: messenger-app-apk
          path: ./*.apk 
